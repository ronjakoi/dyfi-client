[package]
name = "dyfi-client"
version = "0.4.2"
authors = ["Ronja Koistinen <ronja.koistinen@pm.me>"]
edition = "2021"

[dependencies]
dotenvy = "^0.15"
env_logger = "^0.11"
log = "^0.4"
reqwest = { version = "^0.13", features = ["blocking", "query"] }

[dev-dependencies]
mockito = { version = "^1.7", default-features = false }

[profile.release]
strip = true
opt-level = "z"
lto = true
codegen-units = 1
